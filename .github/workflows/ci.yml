name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Boundary gate
        run: |
          # Fail if product path imports the unwired Rust crate or forbidden packages
          if grep -r --include='*.go' -E 'qg-mldsa65|quantumguard/rust' . --exclude-dir=rust; then
            echo "ERROR: Rust ML-DSA crate imported into product path"
            exit 1
          fi
          if grep -r --include='*.go' -E '"net/|"time"' verifier/; then
            echo "ERROR: network or time package in verifier"
            exit 1
          fi
          echo "Boundary gate passed"

      - name: Build qg
        run: go build -o qg ./cmd/qg

      - name: Build qg-http
        run: go build -o qg-http ./cmd/qg-http

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
